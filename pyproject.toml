[project]
name = "pyepr"
version = "0.1.0"
description = "A Python port of the EasySpin EPR simulation library"
authors = [
    { name = "Leonid Rapatskiy", email = "rapatskiy@spincademy.com" }
]
dependencies = [
    "numpy",
    "scipy",
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
