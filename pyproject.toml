[project]
name = "pyepr"
version = "0.1.0"
description = "A Python port of the EasySpin EPR simulation library"
authors = [
    { name = "Leonid Rapatskiy", email = "rapatskiy@spincademy.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easyspin_py", "app"]



